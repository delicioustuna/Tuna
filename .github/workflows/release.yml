name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Determine package version from tag
        id: version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "value=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore Tuna.slnx --disable-parallel

      - name: Build
        run: dotnet build Tuna.slnx -c Release --no-restore -p:Version=${{ steps.version.outputs.value }}

      - name: Test
        run: dotnet test Tuna.slnx -c Release --no-build --no-restore

      - name: Pack
        run: dotnet pack Tuna.slnx -c Release --no-build --no-restore -p:Version=${{ steps.version.outputs.value }} -o ./artifacts/nupkg

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            ./artifacts/nupkg/*.nupkg \
            ./artifacts/nupkg/*.snupkg \
            --title "Tuna ${{ steps.version.outputs.tag }}" \
            --generate-notes
